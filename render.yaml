# Render Blueprint for Tastify — Hybrid Restaurant Recommendation System
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
#
# Database: PostgreSQL (free options: Neon.tech, Supabase, or Render Postgres).
#   1. Create a free Postgres DB (e.g. https://neon.tech — no card required).
#   2. Copy the connection string and convert it:
#        postgresql://user:pass@host/db  →  postgresql+asyncpg://user:pass@host/db
#   3. Set DATABASE_URL on tastify-api (marked "SET ME" below).

services:
  # ── Backend: FastAPI + recommendation engine ──────────────────────────
  - type: web
    name: tastify-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api
    envVars:
      - key: DATABASE_URL
        sync: false # SET ME: postgresql+asyncpg://user:pass@host/dbname
      - key: SECRET_KEY
        sync: false # SET ME: long random string, e.g. `openssl rand -hex 32`
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DEFAULT_TOP_N
        value: "10"
      - key: DEFAULT_ALPHA
        value: "0.5"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Frontend: React + Vite static site ────────────────────────────────
  - type: web
    name: tastify-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tastify-api
          property: host # public hostname e.g. tastify-api-e4s8.onrender.com (scheme added by frontend)

  # NOTE: Frontend uses HashRouter — no SPA rewrite rule needed on the static site.
